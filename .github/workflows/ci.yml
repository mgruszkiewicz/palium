name: Run tests and build application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: make test

  build:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned)
        run: make build-unsigned

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: palium.app
          path: build/DerivedData/Build/Products/Release/palium.app
