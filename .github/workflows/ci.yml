name: Run tests and build application

permissions:
  id-token: write
  contents: read
  attestations: write

on:
  push:
    branches: [main, "ci/artifact-attestation"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: make test

  build:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned)
        run: make build-unsigned

      - name: Create DMG
        run: npm install --global create-dmg@8.1.0 && make dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Palium.dmg
          path: Palium.dmg

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: Palium.dmg
