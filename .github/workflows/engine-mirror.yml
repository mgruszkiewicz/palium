name: Mirror Wine engine

# Publishes an unmodified copy of a Wine engine archive as a GitHub release of
# this repository, so Palium's download doesn't depend on the upstream asset
# staying in place. The archive is downloaded on GitHub's runner and checked
# against the SHA-256 that Palium pins (WineEngine.current.sha256), and the
# release gets a build provenance attestation.
#
# The tag doesn't start with "v", so release.yml (the app release) doesn't run,
# and the release is never marked "Latest", so releases/latest keeps pointing at
# the app.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Engine name, as WineEngine.Release.name (e.g. wine-11.0_1). The tag becomes engine-<name>."
        required: true
      archive_url:
        description: "Upstream archive URL (https)"
        required: true
      sha256:
        description: "Expected SHA-256 of the archive (as pinned in WineEngine.swift)"
        required: true
      source_url:
        description: "Optional: URL of the matching source archive to mirror next to it (LGPL)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      NAME: ${{ inputs.name }}
      ARCHIVE_URL: ${{ inputs.archive_url }}
      SHA256: ${{ inputs.sha256 }}
      SOURCE_URL: ${{ inputs.source_url }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check inputs
        id: inputs
        run: |
          set -euo pipefail
          [[ "$NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::name may only contain letters, digits, . _ -"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sha256 must be 64 lowercase hex digits"; exit 1; }
          [[ "$ARCHIVE_URL" == https://* ]] || { echo "::error::archive_url must be https"; exit 1; }
          [[ -z "$SOURCE_URL" || "$SOURCE_URL" == https://* ]] || { echo "::error::source_url must be https"; exit 1; }
          FILE="$(basename "${ARCHIVE_URL%%\?*}")"
          [[ "$FILE" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected archive file name: $FILE"; exit 1; }
          TAG="engine-$NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; published engines are never replaced"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"

      - name: Download and verify the archive
        env:
          FILE: ${{ steps.inputs.outputs.file }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$FILE" "$ARCHIVE_URL"
          echo "$SHA256  $FILE" | sha256sum --check -
          ls -l "$FILE"

      - name: Download the source archive
        id: source
        if: ${{ inputs.source_url != '' }}
        run: |
          set -euo pipefail
          SRC="source-$(basename "${SOURCE_URL%%\?*}")"
          [[ "$SRC" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected source file name: $SRC"; exit 1; }
          curl --fail --location --retry 3 --output "$SRC" "$SOURCE_URL"
          echo "file=$SRC" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$SRC" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.inputs.outputs.file }}

      - name: Publish the release
        env:
          FILE: ${{ steps.inputs.outputs.file }}
          TAG: ${{ steps.inputs.outputs.tag }}
          SRC: ${{ steps.source.outputs.file }}
          SRC_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -euo pipefail
          {
            echo "Unmodified copy of the Wine engine Palium downloads, so installs don't depend on the upstream asset staying in place."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$FILE\` |"
            echo "| SHA-256 | \`$SHA256\` |"
            echo "| Original | $ARCHIVE_URL |"
            echo
            echo "Palium checks this SHA-256 before installing, from this release or from the original."
            echo
            echo "## License and sources"
            echo
            echo "Wine is licensed under the LGPL 2.1 or later; the engine also bundles other free software under its own licenses."
            echo "This engine is built by the Sikarugir project from CodeWeavers' CrossOver-based Wine sources:"
            echo
            echo "- Sikarugir engines: https://github.com/Sikarugir-App/Engines"
            echo "- Sikarugir Wine tree: https://github.com/Sikarugir-App/wine"
            echo "- CrossOver sources: https://www.codeweavers.com/crossover/source"
            if [[ -n "$SRC" ]]; then
              echo "- Source archive mirrored here: \`$SRC\` (SHA-256 \`$SRC_SHA256\`)"
            fi
          } > notes.md

          ASSETS=("$FILE")
          [[ -n "$SRC" ]] && ASSETS+=("$SRC")
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Wine engine $NAME" \
            --notes-file notes.md \
            --latest=false

          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE" >> "$GITHUB_STEP_SUMMARY"
